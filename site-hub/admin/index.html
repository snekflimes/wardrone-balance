<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Админка — проекты snek.su</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0f1419;
        --panel: #1a222d;
        --border: rgba(148, 163, 184, 0.25);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --ok: #4ade80;
        --danger: #f87171;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: 'DM Sans', system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        padding: 1.25rem;
      }
      .max {
        max-width: 720px;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.35rem;
        margin: 0 0 0.25rem;
      }
      .hint {
        color: var(--muted);
        font-size: 0.88rem;
        margin: 0 0 1.25rem;
        line-height: 1.45;
      }
      label {
        display: block;
        font-size: 0.75rem;
        color: var(--muted);
        margin-bottom: 0.35rem;
      }
      input,
      textarea {
        width: 100%;
        padding: 0.55rem 0.65rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #0c1016;
        color: var(--text);
        font-size: 0.9rem;
        margin-bottom: 0.65rem;
      }
      textarea {
        min-height: 3.2rem;
        resize: vertical;
      }
      .row2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.65rem;
      }
      @media (max-width: 520px) {
        .row2 {
          grid-template-columns: 1fr;
        }
      }
      .token-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        margin-bottom: 1.25rem;
        padding: 0.75rem;
        background: var(--panel);
        border-radius: 10px;
        border: 1px solid var(--border);
      }
      .token-bar input {
        flex: 1;
        min-width: 200px;
        margin: 0;
      }
      button {
        font-family: inherit;
        cursor: pointer;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        padding: 0.45rem 0.85rem;
        font-size: 0.85rem;
      }
      button.primary {
        background: rgba(56, 189, 248, 0.2);
        border-color: rgba(56, 189, 248, 0.45);
        color: #e0f2fe;
      }
      button.danger {
        border-color: rgba(248, 113, 113, 0.4);
        color: #fecaca;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .project {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1rem;
        margin-bottom: 0.75rem;
        background: var(--panel);
      }
      .project-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
        flex-wrap: wrap;
      }
      .project-head strong {
        font-size: 0.9rem;
        color: var(--muted);
      }
      .btns {
        display: flex;
        gap: 0.35rem;
        flex-wrap: wrap;
      }
      .msg {
        padding: 0.65rem 0.85rem;
        border-radius: 8px;
        font-size: 0.88rem;
        margin-bottom: 1rem;
        display: none;
      }
      .msg.on {
        display: block;
      }
      .msg.ok {
        background: rgba(74, 222, 128, 0.12);
        border: 1px solid rgba(74, 222, 128, 0.35);
        color: #bbf7d0;
      }
      .msg.err {
        background: rgba(248, 113, 113, 0.12);
        border: 1px solid rgba(248, 113, 113, 0.35);
        color: #fecaca;
      }
      .site-fields {
        margin-bottom: 1.25rem;
        padding: 1rem;
        border: 1px dashed var(--border);
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <div class="max">
      <h1>Проекты на домене</h1>
      <p class="hint">
        Токен задаётся в <code style="color: #cbd5e1">admin/config.local.php</code> (скопируйте из
        <code style="color: #cbd5e1">config.example.php</code>). Сохранение пишет в
        <code style="color: #cbd5e1">data/projects.json</code> на сервере.
      </p>

      <div class="token-bar">
        <label style="margin: 0; flex: 1; min-width: 180px">
          <span style="display: block; margin-bottom: 4px">X-Admin-Token</span>
          <input type="password" id="token" placeholder="Вставьте токен" autocomplete="off" />
        </label>
        <button type="button" class="primary" id="btnLoad">Загрузить</button>
      </div>

      <div class="msg" id="msg"></div>

      <div class="site-fields">
        <label>Заголовок сайта</label>
        <input type="text" id="siteTitle" />
        <label>Подзаголовок</label>
        <input type="text" id="siteSubtitle" />
      </div>

      <div id="projects"></div>

      <button type="button" class="primary" id="btnAdd" style="margin-bottom: 1rem">+ Добавить проект</button>
      <div>
        <button type="button" class="primary" id="btnSave">Сохранить на сервер</button>
        <a href="../" style="margin-left: 0.75rem; color: var(--accent); font-size: 0.9rem">← На главную</a>
      </div>
    </div>

    <script>
      (function () {
        var STORAGE_KEY = 'snek-hub-admin-token';
        var tokenInput = document.getElementById('token');
        var msg = document.getElementById('msg');
        var projectsEl = document.getElementById('projects');

        try {
          tokenInput.value = localStorage.getItem(STORAGE_KEY) || '';
        } catch (e) {}

        function showMsg(text, ok) {
          msg.textContent = text;
          msg.className = 'msg on ' + (ok ? 'ok' : 'err');
        }
        function hideMsg() {
          msg.className = 'msg';
        }

        function uid() {
          return 'p_' + Math.random().toString(36).slice(2, 10);
        }

        var state = { siteTitle: 'snek.su', siteSubtitle: '', projects: [] };

        function renderProjects() {
          projectsEl.innerHTML = '';
          state.projects.forEach(function (p, i) {
            var box = document.createElement('div');
            box.className = 'project';
            box.dataset.index = String(i);
            var head = document.createElement('div');
            head.className = 'project-head';
            head.innerHTML = '<strong>Проект #' + (i + 1) + '</strong>';
            var btns = document.createElement('div');
            btns.className = 'btns';
            var up = document.createElement('button');
            up.type = 'button';
            up.textContent = '↑';
            up.title = 'Выше';
            up.onclick = function () {
              if (i <= 0) return;
              var t = state.projects[i - 1];
              state.projects[i - 1] = state.projects[i];
              state.projects[i] = t;
              renderProjects();
            };
            var down = document.createElement('button');
            down.type = 'button';
            down.textContent = '↓';
            down.title = 'Ниже';
            down.onclick = function () {
              if (i >= state.projects.length - 1) return;
              var t = state.projects[i + 1];
              state.projects[i + 1] = state.projects[i];
              state.projects[i] = t;
              renderProjects();
            };
            var del = document.createElement('button');
            del.type = 'button';
            del.className = 'danger';
            del.textContent = 'Удалить';
            del.onclick = function () {
              state.projects.splice(i, 1);
              renderProjects();
            };
            btns.appendChild(up);
            btns.appendChild(down);
            btns.appendChild(del);
            head.appendChild(btns);
            box.appendChild(head);

            function field(label, key, type) {
              var l = document.createElement('label');
              l.textContent = label;
              var inp = document.createElement(type === 'textarea' ? 'textarea' : 'input');
              if (type !== 'textarea') inp.type = type || 'text';
              inp.value = p[key] != null ? String(p[key]) : '';
              inp.addEventListener('input', function () {
                p[key] = inp.value;
              });
              box.appendChild(l);
              box.appendChild(inp);
            }

            field('id (латиница, без пробелов)', 'id', 'text');
            field('Название', 'title', 'text');
            field('Путь (например /wardrone/)', 'href', 'text');
            field('Краткое описание', 'description', 'textarea');
            field('Акцентный цвет (CSS, напр. #4ade80)', 'accent', 'text');

            projectsEl.appendChild(box);
          });
        }

        function syncSiteFields() {
          document.getElementById('siteTitle').value = state.siteTitle;
          document.getElementById('siteSubtitle').value = state.siteSubtitle;
        }

        document.getElementById('siteTitle').addEventListener('input', function () {
          state.siteTitle = this.value;
        });
        document.getElementById('siteSubtitle').addEventListener('input', function () {
          state.siteSubtitle = this.value;
        });

        function getToken() {
          return tokenInput.value.trim();
        }

        document.getElementById('btnLoad').onclick = function () {
          hideMsg();
          var t = getToken();
          if (!t) {
            showMsg('Введите токен', false);
            return;
          }
          try {
            localStorage.setItem(STORAGE_KEY, t);
          } catch (e) {}
          fetch('./save.php', {
            headers: { 'X-Admin-Token': t },
          })
            .then(function (r) {
              if (r.status === 403) throw new Error('Неверный токен');
              if (!r.ok) throw new Error('HTTP ' + r.status);
              return r.json();
            })
            .then(function (data) {
              state.siteTitle = data.siteTitle || 'snek.su';
              state.siteSubtitle = data.siteSubtitle || '';
              state.projects = Array.isArray(data.projects) ? data.projects.slice() : [];
              if (state.projects.length === 0) {
                state.projects.push({
                  id: uid(),
                  title: 'Новый проект',
                  href: '/',
                  description: '',
                  accent: '#38bdf8',
                });
              }
              syncSiteFields();
              renderProjects();
              showMsg('Загружено', true);
            })
            .catch(function () {
              fetch('../data/projects.json', { cache: 'no-store' })
                .then(function (r) {
                  return r.json();
                })
                .then(function (data) {
                  state.siteTitle = data.siteTitle || 'snek.su';
                  state.siteSubtitle = data.siteSubtitle || '';
                  state.projects = Array.isArray(data.projects) ? data.projects.slice() : [];
                  syncSiteFields();
                  renderProjects();
                  showMsg('Загружено из публичного JSON (только чтение). Для сохранения нужен верный токен и save.php.', false);
                })
                .catch(function () {
                  showMsg('Не удалось загрузить', false);
                });
            });
        };

        document.getElementById('btnAdd').onclick = function () {
          state.projects.push({
            id: uid(),
            title: 'Новый проект',
            href: '/',
            description: '',
            accent: '#a78bfa',
          });
          renderProjects();
        };

        document.getElementById('btnSave').onclick = function () {
          hideMsg();
          var t = getToken();
          if (!t) {
            showMsg('Введите токен', false);
            return;
          }
          try {
            localStorage.setItem(STORAGE_KEY, t);
          } catch (e) {}

          var payload = {
            siteTitle: state.siteTitle.trim() || 'snek.su',
            siteSubtitle: state.siteSubtitle.trim(),
            projects: state.projects.map(function (p) {
              return {
                id: String(p.id || uid()).replace(/\s+/g, '_'),
                title: String(p.title || '').trim() || 'Без названия',
                href: String(p.href || '/').trim() || '/',
                description: String(p.description || '').trim(),
                accent: String(p.accent || '').trim() || '#38bdf8',
              };
            }),
          };

          fetch('./save.php', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-Admin-Token': t,
            },
            body: JSON.stringify(payload),
          })
            .then(function (r) {
              return r.json().then(function (j) {
                return { ok: r.ok, j: j };
              });
            })
            .then(function (_ref) {
              if (_ref.j && _ref.j.ok) showMsg('Сохранено', true);
              else showMsg((_ref.j && _ref.j.error) || 'Ошибка сохранения', false);
            })
            .catch(function () {
              showMsg('Сеть или сервер', false);
            });
        };

        // Первый показ: попробовать публичный JSON
        fetch('../data/projects.json', { cache: 'no-store' })
          .then(function (r) {
            return r.json();
          })
          .then(function (data) {
            state.siteTitle = data.siteTitle || 'snek.su';
            state.siteSubtitle = data.siteSubtitle || '';
            state.projects = Array.isArray(data.projects) ? data.projects.slice() : [];
            syncSiteFields();
            renderProjects();
          })
          .catch(function () {
            state.projects = [
              {
                id: 'example',
                title: 'Пример',
                href: '/',
                description: 'Загрузите данные с сервера (токен) или настройте projects.json',
                accent: '#38bdf8',
              },
            ];
            syncSiteFields();
            renderProjects();
          });
      })();
    </script>
  </body>
</html>
