name: Deploy to ispmanager (FTP)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

concurrency:
  group: deploy-ispmanager-ftp
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Игра: только содержимое dist/ → secrets.FTP_SERVER_DIR (например www/snek.su/wardrone/).
      - name: Deploy game (dist) via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}

      # Хаб: site-hub/ → корень домена. Путь из variable ИЛИ secret FTP_SITE_HUB_DIR (в if: нельзя ссылаться на secrets — поэтому resolve в bash).
      - name: Resolve site hub FTP directory
        id: hub_ftp
        env:
          HUB_VAR: ${{ vars.FTP_SITE_HUB_DIR }}
          HUB_SECRET: ${{ secrets.FTP_SITE_HUB_DIR }}
        run: |
          if [ -n "$HUB_VAR" ]; then
            echo "server_dir=$HUB_VAR" >> "$GITHUB_OUTPUT"
            echo "Hub deploy: using repository variable FTP_SITE_HUB_DIR"
          elif [ -n "$HUB_SECRET" ]; then
            echo "server_dir=$HUB_SECRET" >> "$GITHUB_OUTPUT"
            echo "Hub deploy: using secret FTP_SITE_HUB_DIR"
          else
            echo "::warning::FTP_SITE_HUB_DIR not set — hub deploy skipped. Set Actions Variable or Secret (same name), e.g. www/snek.su"
          fi

      - name: Deploy site hub via FTP
        if: ${{ steps.hub_ftp.outputs.server_dir != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: site-hub/
          server-dir: ${{ steps.hub_ftp.outputs.server_dir }}
          exclude: |
            **/.git*
            **/.git*/**
            data/projects.json

