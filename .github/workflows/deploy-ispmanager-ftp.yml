name: Deploy to ispmanager (FTP)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

concurrency:
  group: deploy-ispmanager-ftp
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Site hub FTP path (diagnostic)
        run: |
          if [ -n "${{ vars.FTP_SITE_HUB_DIR }}" ]; then
            echo "Hub: will use repository variable FTP_SITE_HUB_DIR"
          elif [ -n "${{ secrets.FTP_SITE_HUB_DIR }}" ]; then
            echo "Hub: will use secret FTP_SITE_HUB_DIR"
          else
            echo "::warning::FTP_SITE_HUB_DIR is empty — hub deploy step will be SKIPPED. Add it under Settings → Secrets and variables → Actions: either Repository variable (recommended) or Secret, name exactly FTP_SITE_HUB_DIR, value e.g. www/snek.su"
          fi

      # Игра: только содержимое dist/ → secrets.FTP_SERVER_DIR (например www/snek.su/wardrone/).
      - name: Deploy game (dist) via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}

      # Хаб: site-hub/ → корень домена. Путь: repository variable ИЛИ secret FTP_SITE_HUB_DIR (например www/snek.su).
      # Если оба пустые — шаг пропускается (workflow всё равно зелёный). data/projects.json не заливается.
      - name: Deploy site hub via FTP
        if: ${{ vars.FTP_SITE_HUB_DIR != '' || secrets.FTP_SITE_HUB_DIR != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: site-hub/
          server-dir: ${{ vars.FTP_SITE_HUB_DIR != '' && vars.FTP_SITE_HUB_DIR || secrets.FTP_SITE_HUB_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            data/projects.json

